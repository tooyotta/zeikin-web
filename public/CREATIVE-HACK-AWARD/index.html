      }

      .head__meta {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--gray);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 12px 0;
        background: linear-gradient(var(--bg) 70%, rgba(0, 0, 0, 0));
      }

      .actions a {
        font-family: var(--font-mono);
        font-size: 13px;
        text-decoration: none;
        padding: 10px 16px;
        border: 1px solid var(--lime);
        color: var(--lime);
      }

      .actions a:hover {
        background: var(--lime);
        color: var(--bg);
      }

      .pages {
        display: flex;
        flex-direction: column;
        gap: 28px;
        margin-top: 12px;
      }

      .page-card {
        margin: 0;
      }

      .page-card img {
        display: block;
        width: 100%;
        height: auto;
        background: #111;
        border: 1px solid var(--gray);
      }

      .page-card figcaption {
        margin-top: 6px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--gray);
      }

      .foot {

        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--gray);
      }

      @media (max-width: 600px) {

        .pages {

      }
