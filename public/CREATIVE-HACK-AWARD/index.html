<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />

    <title>zeikin.org — CREATIVE HACK AWARD entry</title>
    <meta name="description" content="zeikin.org / CREATIVE HACK AWARD 応募資料" />
    <meta name="theme-color" content="#000000" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Fragment+Mono&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #000000;
        --fg: #ffffff;
        --lime: #d9fc53;
        --gray: #555555;
        --font-pixel: "DotGothic16", sans-serif;
        --font-mono: "Fragment Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-pixel);
      }

      .page {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding: 24px;
        gap: 20px;
      }

      .head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px 16px;
      }

      .head__home {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--lime);
        text-decoration: none;
        border-bottom: 1px solid var(--lime);
      }

      .head__title {
        margin: 0;
        font-size: clamp(20px, 4vw, 34px);
        letter-spacing: 0.02em;
      }

      .head__meta {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--gray);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .actions a {
        font-family: var(--font-mono);
        font-size: 13px;
        text-decoration: none;
        padding: 10px 16px;
        border: 1px solid var(--lime);
        color: var(--lime);
      }

      .actions a:hover {
        background: var(--lime);
        color: var(--bg);
      }

      .viewer {
        flex: 1;
        min-height: 70vh;
        border: 1px solid var(--gray);
        background: #111;
      }

      .viewer object,
      .viewer iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .fallback {
        padding: 24px;
        font-size: 14px;
        line-height: 1.8;
      }

      .fallback a {
        color: var(--lime);
      }

      .foot {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--gray);
      }

      @media (max-width: 600px) {
        .page {
          padding: 16px;
        }
        .viewer {
          min-height: 60vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="head">
        <a class="head__home" href="/">zeikin.org</a>
        <h1 class="head__title">CREATIVE HACK AWARD</h1>
        <span class="head__meta">entry document / 14 pages / PDF</span>
      </header>

      <nav class="actions">
        <a href="/CREATIVE-HACK-AWARD/zeikin-entry.pdf">PDF を開く</a>
        <a href="/CREATIVE-HACK-AWARD/zeikin-entry.pdf" download>ダウンロード</a>
      </nav>

      <main class="viewer">
        <object data="/CREATIVE-HACK-AWARD/zeikin-entry.pdf" type="application/pdf">
          <div class="fallback">
            <p>このブラウザは PDF のインライン表示に対応していません。</p>
            <p><a href="/CREATIVE-HACK-AWARD/zeikin-entry.pdf">zeikin-entry.pdf を開く</a></p>
          </div>
        </object>
      </main>

      <footer class="foot">zeikin.org — 応募資料（作成中の版）</footer>
    </div>
  </body>
</html>
