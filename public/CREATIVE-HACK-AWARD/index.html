    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Fragment+Mono&display=swap"
      rel="stylesheet"

    <style>
      :root {
        --bg: #000000;
        --fg: #ffffff;
        --lime: #d9fc53;
        --gray: #555555;
        --font-pixel: "DotGothic16", sans-serif;
        --font-mono: "Fragment Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-pixel);
      }

      .page {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px 24px 64px;
      }

      h1 {
        margin: 0 0 20px;
        font-size: clamp(22px, 4.2vw, 40px);
        font-weight: 400;
        line-height: 1.25;
        letter-spacing: 0.02em;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 12px 0;
        background: linear-gradient(var(--bg) 70%, rgba(0, 0, 0, 0));
      }

      .actions a {
        font-family: var(--font-mono);
        font-size: 15px;
        text-decoration: none;
        padding: 10px 16px;
        border: 1px solid var(--lime);
        color: var(--lime);
      }

      .actions a:hover {
        background: var(--lime);
        color: var(--bg);
      }

      .pages {
        display: flex;
        flex-direction: column;
        gap: 28px;
        margin-top: 12px;
      }

      .pages img {
        display: block;
        width: 100%;
        height: auto;
        background: #111;
        border: 1px solid var(--gray);
      }

      @media (max-width: 600px) {
        .page {
          padding: 16px 16px 48px;
        }
        .pages {
          gap: 18px;
        }
      }
    </style>
  </head>
